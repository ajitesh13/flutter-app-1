name: shanatani
description: Shanatani - Daily Puja, Aarti & Mandir
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  share_plus: ^10.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/data/seed/deities.json
    - lib/data/seed/prayers.json
    - lib/data/seed/festivals.json
    - lib/data/seed/share_templates.json

